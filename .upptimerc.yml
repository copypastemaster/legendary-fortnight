# Change these first
owner: copypastemaster # Your GitHub organization or username, where this repository lives
repo: legendary-fortnight # The name of this repository

# Only these secrets are passed to the monitor (GH_PAT is passed separately).
secrets:
  - PROD_HEALTH_ENDPOINT
  - STAGING_HEALTH_ENDPOINT
  - DEV_HEALTH_ENDPOINT
  - PROD_HEALTH_REDIS
  - STAGING_HEALTH_REDIS
  - DEV_HEALTH_REDIS
  - PROD_HEALTH_JOURNALBOT
  - STAGING_HEALTH_JOURNALBOT
  - DEV_HEALTH_JOURNALBOT
  - PROD_HEALTH_CAREBOT
  - STAGING_HEALTH_CAREBOT
  - DEV_HEALTH_CAREBOT
  - NOTIFICATION_SLACK
  - NOTIFICATION_SLACK_WEBHOOK_URL
  - NOTIFICATION_CUSTOM_WEBHOOK
  - NOTIFICATION_CUSTOM_WEBHOOK_URL

sites:
    #  Frontend
  - name: ReachLink Production Frontend
    url: https://app1.reachlink.com
  - name: ReachLink Staging Frontend
    url: https://staging.reachlink.com
  - name: ReachLink Dev Frontend
    url: https://dev.reachlink.com

    #  Backend
  - name: ReachLink Production Backend
    url: $PROD_HEALTH_ENDPOINT
  - name: ReachLink Staging Backend
    url: $STAGING_HEALTH_ENDPOINT
  - name: ReachLink Dev Backend
    url: $DEV_HEALTH_ENDPOINT

    #  Redis
  - name: Production redis
    url: $PROD_HEALTH_REDIS
  - name: Staging redis
    url: $STAGING_HEALTH_REDIS
  - name: Dev redis
    url: $DEV_HEALTH_REDIS

    # Journalbot
  - name: ReachLink Journalbot Production
    url: $PROD_HEALTH_JOURNALBOT
  - name: ReachLink Journalbot Staging
    url: $STAGING_HEALTH_JOURNALBOT
  - name: ReachLink Journalbot Dev
    url: $DEV_HEALTH_JOURNALBOT

    # Carebot
  - name: ReachLink Carebot Production
    url: $PROD_HEALTH_CAREBOT
  - name: ReachLink Carebot Staging
    url: $STAGING_HEALTH_CAREBOT
  - name: ReachLink Carebot Dev
    url: $DEV_HEALTH_CAREBOT

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: staging.reachlink.com
  # faviconSvg: https://raw.githubusercontent.com/reachlink/reachlink-frontend/public/favicon/Reachlink_Favicon.svg
  baseUrl: /legendary-fortnight
  # logoUrl: https://raw.githubusercontent.com/reachlink/reachlink-frontend/public/favicon/Reachlink_Favicon.svg
  name: ReachLink Health
  introTitle: "**ReachLink System Health**" 
  introMessage: ReachLink monitoring for backend, frontend, and redis services.
  navbar:
    - title: Status
      href: /legendary-fortnight
    # - title: GitHub
    #   href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
